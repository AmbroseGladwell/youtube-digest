# One small machine that stops when idle and starts on the next request; Postgres is on Neon
# and there is no volume (docs/architecture/v1-architecture-decisions.md, docs/architecture/deploy.md).
# APP_URL is the domain, not the fly.dev hostname: magic links open there and the session
# cookie is set for it (docs/architecture/deploy.md, The domain).
app = "the-overview-app"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  STATIC_ROOT = "/app/apps/web/dist"
  APP_URL = "https://theoverviewapp.com"
  # The extension's origin, from the store's key in its manifest: task deploy:extension:id derives it.
  CORS_ALLOWED_ORIGINS = "chrome-extension://bcobfcijigdegfldefejaeicgcogienn"
  MAIL_TRANSPORT = "brevo"
  MAIL_FROM = "The Overview <hello@theoverviewapp.com>"
  MIN_SUPPORTED_CLIENT_VERSION = "1"
  SESSION_TTL_DAYS = "30"
  # Fly's proxy sets this and overwrites any a client sends; rate limits count by it
  # (docs/architecture/api.md, "Rate limits").
  CLIENT_IP_HEADER = "fly-client-ip"
  # Narration: the private TTS pool over Flycast, one render per machine, into the private R2
  # bucket (docs/architecture/deploy.md, "The TTS service"; the two R2 keys are secrets).
  TTS_URL = "http://the-overview-tts.flycast"
  TTS_CONCURRENCY = "5"
  R2_ACCOUNT_ID = "781691f32a5cf03b132121e499f510a4"
  R2_BUCKET = "the-overview-audio"
  # Tags every event passed on to PostHog; nothing is passed on until POSTHOG_API_KEY is set
  # (docs/architecture/analytics.md, "Turning it on").
  ANALYTICS_ENVIRONMENT = "production"
  # The PostHog project's numeric id, which the POSTHOG_PERSONAL_API_KEY secret erases a deleted
  # account's events in. Erasure is on exactly when that key is set, so this can ship ahead of it
  # (docs/features/account-deletion.md, "Erasure at PostHog").
  POSTHOG_PROJECT_ID = "289890"
  # Our server fetches a transcript when every other rung fails, through the proxy named in the
  # TRANSCRIPT_PROXY_URL secret, up to the default 1,000 proxied fetches a day
  # (docs/architecture/server-side-transcripts.md).
  TRANSCRIPT_SERVICE = "on"
  # Start's samples, in order: live shares owned by the house account, so they're replaced or
  # stopped there like any share (docs/features/onboarding.md, "Try a sample").
  SAMPLE_SHARE_TOKENS = "IQ1AeRPcSQ1XkkOv,pCdVwW1EUsSH3Krp,eeK1DREKBooGFrJZ,Gjhrz5pGLs8lpqTZ,WQpV-nH9iRq4AE9b,gTd3Svmu7vuIq26n,tH7DvGZSyxI_7tMo,s8Q8lBSR_ivC9yr9"

# Renders any missing voice sample before the new version goes live
# (docs/features/narration-voice.md, "The samples").
[deploy]
  release_command = "node apps/api/dist/scripts/seedVoiceSamples.js"
  release_command_timeout = "10m"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # /api/live answers from the process alone, so this check never wakes Neon; the database is
  # checked once at startup and by the deploy job (docs/architecture/deploy.md, "The machine").
  [[http_service.checks]]
    method = "GET"
    path = "/api/live"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
