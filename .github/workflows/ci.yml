name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run typecheck
      - run: npm run typecheck:iwft --workspace packages/app-core

  unit-packages:
    name: unit (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - domain
          - transcripts
          - generation
          - store-conformance
          - store-local
          - sync
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm test --workspace packages/${{ matrix.package }}

  unit-app:
    name: unit (app-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm test --workspace packages/app-core

  unit-extension:
    name: unit (extension)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm test --workspace apps/extension

  unit-api:
    name: unit (api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm test --workspace apps/api

  unit-tooling:
    name: unit (tooling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run test:tooling

  unit-tts:
    name: unit (tts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/tts
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: 0.12.17
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # The model is 353 MB and pinned by hash, so it is cached by those hashes
      # (docs/conventions/tts-testing-guide.md).
      - uses: actions/cache@v6
        with:
          path: services/tts/models
          key: kokoro-v1.0-${{ hashFiles('services/tts/download_model.sh') }}
      - run: ./download_model.sh models
      - run: uv run --frozen pytest

  iwft:
    name: iwft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx playwright install --with-deps chromium
      - run: npm run test:iwft --workspace packages/app-core
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: iwft-traces
          path: packages/app-core/test-results/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - web
          - extension
          - api
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run build --workspace apps/${{ matrix.app }}
      # Only main's build is a release, so only it uploads the extension's maps; every other
      # build deletes them, so no zip ever carries one (docs/architecture/errors-and-logs.md, "Source maps").
      - if: matrix.app == 'extension'
        run: node scripts/uploadSourceMaps.mjs apps/extension/dist overview-extension
        env:
          POSTHOG_CLI_API_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.POSTHOG_CLI_API_KEY || '' }}
          POSTHOG_CLI_PROJECT_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.POSTHOG_CLI_PROJECT_ID || '' }}
      - if: matrix.app == 'extension'
        run: node scripts/packExtension.mjs
      - if: matrix.app == 'extension'
        uses: actions/upload-artifact@v7
        with:
          name: extension-${{ github.sha }}
          path: apps/extension/release
          retention-days: 14
          if-no-files-found: error

  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg BUILD_COMMIT=${{ github.sha }} --tag overview:${{ github.sha }} .

  image-tts:
    name: image (tts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag overview-tts:${{ github.sha }} services/tts

  ci:
    name: ci
    runs-on: ubuntu-latest
    if: always()
    needs:
      - typecheck
      - unit-packages
      - unit-app
      - unit-extension
      - unit-api
      - unit-tooling
      - unit-tts
      - iwft
      - build
      - image
      - image-tts
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # A merge to main that passed everything above is a release. Deploys queue rather than
  # cancel each other, so a second merge waits for the first machine to come up healthy
  # (docs/architecture/deploy.md).
  # The app goes out only once the TTS pool has, so an app that sends something new never
  # reaches a pool that refuses it (docs/architecture/deploy.md, "Deploy order").
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: [ci, deploy-tts]
    if: needs.ci.result == 'success' && needs.deploy-tts.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://theoverviewapp.com
    steps:
      - uses: actions/checkout@v7
      # The zips the build job made from this same commit, read back before anything
      # ships: a release is only ever tagged with zips built from the commit it deployed.
      - uses: actions/download-artifact@v7
        with:
          name: extension-${{ github.sha }}
          path: apps/extension/release
      - run: node scripts/verifyRelease.mjs ${{ github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # The PostHog key goes in as a build secret, so the image injects and uploads the web
      # app's maps without any layer keeping it (docs/architecture/errors-and-logs.md, "Source maps").
      - run: >-
          flyctl deploy --remote-only --build-arg BUILD_COMMIT=${{ github.sha }}
          --build-secret POSTHOG_CLI_API_KEY="$POSTHOG_CLI_API_KEY"
          --build-secret POSTHOG_CLI_PROJECT_ID="$POSTHOG_CLI_PROJECT_ID"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
      - run: curl --fail --silent --show-error https://theoverviewapp.com/api/health
      # A tag marks the first deploy of each version; later deploys under the same number
      # are told apart by the commit Settings shows (docs/architecture/deploy.md).
      - name: tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already tagged; this deploy of ${{ github.sha }} stays under it"
          else
            zips=("apps/extension/release/the-overview-$version.zip")
            keyed="apps/extension/release/the-overview-$version-unpacked.zip"
            if [ -f "$keyed" ]; then
              zips+=("$keyed")
            fi
            gh release create "v$version" "${zips[@]}" \
              --target "${{ github.sha }}" --title "v$version" --generate-notes
          fi

  # The TTS pool deploys from here too, with its own token, and only when services/tts differs
  # from what its machines say is live: comparing with the previous push would miss a change
  # whose run was cancelled by a later merge (docs/architecture/deploy.md, "The TTS service").
  deploy-tts:
    name: deploy (tts)
    runs-on: ubuntu-latest
    needs: ci
    if: needs.ci.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: deploy-tts
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_TTS_API_TOKEN }}
    steps:
      - id: token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning::FLY_TTS_API_TOKEN isn't set, so the TTS service wasn't deployed"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - if: steps.token.outputs.ready == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master
      - id: decide
        if: steps.token.outputs.ready == 'true'
        run: |
          flyctl machines list --app the-overview-tts --json > "$RUNNER_TEMP/machines.json"
          node scripts/ttsDeployDecision.mjs decide "$RUNNER_TEMP/machines.json" ${{ github.sha }}
      - if: steps.decide.outputs.deploy == 'true'
        working-directory: services/tts
        run: flyctl deploy --remote-only --ha=false --env DEPLOYED_COMMIT=${{ github.sha }}
      - if: steps.decide.outputs.deploy == 'true'
        run: |
          flyctl machines list --app the-overview-tts --json > "$RUNNER_TEMP/machines.json"
          node scripts/ttsDeployDecision.mjs verify "$RUNNER_TEMP/machines.json" ${{ github.sha }}
