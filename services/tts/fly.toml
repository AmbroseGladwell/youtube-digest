# The Kokoro pool: identical performance-4x machines, stopped until the API needs one, one
# render each, reachable only over Flycast (docs/architecture/deploy.md, "The TTS service").
app = "the-overview-tts"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  IDLE_EXIT_SECONDS = "15"

[[services]]
  internal_port = 8000
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [services.concurrency]
    type = "requests"
    soft_limit = 1
    hard_limit = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]

[[vm]]
  size = "performance-4x"
