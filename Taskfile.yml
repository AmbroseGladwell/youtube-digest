# The front door. Every task wraps a package.json script or a tool the Nix shell provides;
# the build logic stays where it belongs, and CI runs the same scripts (docs/conventions/local-dev.md).
version: '3'
silent: true

includes:
  local:
    taskfile: ./Taskfiles/Taskfile-local.yml
    flatten: true
    optional: true
  run:
    taskfile: ./Taskfiles/Taskfile-run.yml
    flatten: true
  test:
    taskfile: ./Taskfiles/Taskfile-test.yml
    flatten: true
  deploy:
    taskfile: ./Taskfiles/Taskfile-deploy.yml
    flatten: true

tasks:
  default:
    cmds:
      - task --list

  search:
    desc: 'Search the task list by keyword (e.g. task search -- test)'
    cmds:
      - task --list | grep -i "{{.CLI_ARGS}}"

  install:
    desc: Install every workspace's dependencies exactly as CI does, and point git at the repo's hooks
    cmds:
      - npm ci
      - git config core.hooksPath .githooks

  secrets:
    desc: Render .env from .env.tpl with the secrets in Bitwarden (docs/conventions/secrets.md)
    aliases: [env:init]
    preconditions:
      - sh: command -v bws
        msg: 'bws is missing. Enter the dev shell first: direnv allow, or nix develop.'
      - sh: test -n "${BWS_ACCESS_TOKEN:-}"
        msg: 'No Bitwarden access token in the environment. Store one with: task secrets:login'
    cmds:
      - scripts/secrets.sh render

  secrets:login:
    desc: Store the Bitwarden machine access token in the login keychain, where .envrc reads it
    cmds:
      - scripts/secrets.sh login

  secrets:run:
    desc: 'Run one command with the secrets injected and nothing written (e.g. task secrets:run -- npx tsx scripts/endToEndSanityCheck.ts)'
    preconditions:
      - sh: test -n "${BWS_ACCESS_TOKEN:-}"
        msg: 'No Bitwarden access token in the environment. Store one with: task secrets:login'
    cmds:
      - scripts/secrets.sh run {{.CLI_ARGS}}

  secrets:seed:
    desc: One-time migration; create the Bitwarden project and copy the values from an existing hand-written .env into it
    preconditions:
      - sh: test -n "${BWS_ACCESS_TOKEN:-}"
        msg: 'No Bitwarden access token in the environment. Store one with: task secrets:login'
    cmds:
      - scripts/secrets.sh seed

  test:tooling:
    desc: Run the tests for the repo's own scripts and hooks
    cmds:
      - npm run test:tooling

  clean:
    desc: Remove every build output and the local Postgres data (node_modules and .env stay)
    prompt: This deletes dist/ everywhere and the local database under .local/. Continue?
    cmds:
      - task: db:stop
      - find . -name dist -type d -prune -not -path '*/node_modules/*' -exec rm -rf {} +
      - rm -rf .local
