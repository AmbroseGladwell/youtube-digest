version: '3'
silent: true

vars:
  PGDATA: '{{.ROOT_DIR}}/.local/pg'
  PGPORT: '5433'
  PGLOG: '{{.ROOT_DIR}}/.local/pg.log'

tasks:
  run:
    desc: Run the whole local stack — Postgres, the API on :3000 and the web app on :5173
    cmds:
      - task: run:db
      - task: run:stack

  run:stack:
    internal: true
    deps:
      - run:api
      - run:web

  run:tts:
    desc: Run the TTS service on :8000 with the local model (fetched by task tts:model); it stops itself after IDLE_EXIT_SECONDS without a render
    dir: services/tts
    deps: [tts:model]
    env:
      MODEL_DIR: models
      IDLE_EXIT_SECONDS: '{{.IDLE_EXIT_SECONDS | default "600"}}'
    cmds:
      - uv run --frozen python -m overview_tts.serve

  tts:model:
    desc: Fetch Kokoro v1.0 into services/tts/models, checked against its pinned SHA-256
    dir: services/tts
    status:
      - test -f models/kokoro-v1.0.onnx
      - test -f models/voices-v1.0.bin
    cmds:
      - ./download_model.sh models

  run:db:
    desc: Start the local Postgres 17 under .local/pg (created on first run), then wait for it
    preconditions:
      - sh: command -v pg_ctl
        msg: 'Postgres is missing. Enter the dev shell first: direnv allow, or nix develop.'
    status:
      - pg_isready -q -h localhost -p {{.PGPORT}}
    cmds:
      - task: db:init
      - mkdir -p "{{.ROOT_DIR}}/.local"
      - pg_ctl -D "{{.PGDATA}}" -l "{{.PGLOG}}" -o "-p {{.PGPORT}} -k /tmp" start
      - task: db:wait
      - task: db:create

  db:init:
    internal: true
    status:
      - test -d "{{.PGDATA}}"
    cmds:
      - mkdir -p "{{.ROOT_DIR}}/.local"
      - initdb -D "{{.PGDATA}}" --username=overview --auth=trust --encoding=UTF8 > /dev/null

  db:wait:
    internal: true
    cmds:
      - for i in $(seq 1 30); do pg_isready -q -h localhost -p {{.PGPORT}} && exit 0; sleep 0.5; done; echo "Postgres did not come up; see {{.PGLOG}}"; exit 1

  db:create:
    internal: true
    status:
      - psql -h localhost -p {{.PGPORT}} -U overview -lqt | cut -d '|' -f 1 | grep -qw overview
    cmds:
      - createdb -h localhost -p {{.PGPORT}} -U overview overview

  db:stop:
    desc: Stop the local Postgres
    status:
      - '! pg_isready -q -h localhost -p {{.PGPORT}}'
    cmds:
      - pg_ctl -D "{{.PGDATA}}" stop > /dev/null

  db:psql:
    desc: Open psql on the local database (e.g. task db:psql -- -c "select count(*) from records")
    preconditions:
      - sh: pg_isready -q -h localhost -p {{.PGPORT}}
        msg: 'Postgres is not running. Start it with: task run:db'
    cmds:
      - psql -h localhost -p {{.PGPORT}} -U overview overview {{.CLI_ARGS}}

  run:api:
    desc: Build and start the API on :3000 against .env (builds once; restart after API changes)
    dir: apps/api
    preconditions:
      - sh: test -f "{{.ROOT_DIR}}/.env"
        msg: 'No .env at the repo root. Render one with: task secrets'
      - sh: test -d "{{.ROOT_DIR}}/packages/domain/dist"
        msg: 'The library packages are not built. Build them with: task build:packages'
      - sh: pg_isready -q -h localhost -p {{.PGPORT}}
        msg: 'Postgres is not running. Start it with: task run:db'
    cmds:
      - npm run dev

  run:web:
    desc: Start the web app on :5173, proxying /api to the API (set API_URL to point elsewhere)
    dir: apps/web
    preconditions:
      - sh: test -d "{{.ROOT_DIR}}/packages/domain/dist"
        msg: 'The library packages are not built. Build them with: task build:packages'
    cmds:
      - npm run dev

  run:extension:
    desc: Build the extension into apps/extension/dist, to load unpacked at chrome://extensions
    dir: apps/extension
    cmds:
      - npm run build
      - echo "Load {{.ROOT_DIR}}/apps/extension/dist as an unpacked extension. Rebuild after changes."

  session:
    desc: 'Mint a bearer token with no mail involved, creating the account if needed (e.g. task session -- you@example.com)'
    dir: apps/api
    preconditions:
      - sh: test -n "{{.CLI_ARGS}}"
        msg: 'An email is needed: task session -- you@example.com'
      - sh: test -f "{{.ROOT_DIR}}/.env"
        msg: 'No .env at the repo root. Render one with: task secrets'
      - sh: pg_isready -q -h localhost -p {{.PGPORT}}
        msg: 'Postgres is not running. Start it with: task run:db'
    cmds:
      - npm run -s mint-session -- {{.CLI_ARGS}}

  plan:
    desc: 'Put a signed-up account on free or plus, until billing exists (e.g. task plan -- you@example.com plus)'
    dir: apps/api
    preconditions:
      - sh: test -n "{{.CLI_ARGS}}"
        msg: 'An email and a plan are needed: task plan -- you@example.com plus'
      - sh: test -f "{{.ROOT_DIR}}/.env"
        msg: 'No .env at the repo root. Render one with: task secrets'
      - sh: pg_isready -q -h localhost -p {{.PGPORT}}
        msg: 'Postgres is not running. Start it with: task run:db'
    cmds:
      - npm run -s set-plan -- {{.CLI_ARGS}}
