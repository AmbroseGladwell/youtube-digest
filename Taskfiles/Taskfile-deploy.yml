version: '3'
silent: true

vars:
  PROD_PROJECT: overview-prod

tasks:
  deploy:
    desc: Build the image on Fly's builders from this checkout and roll it out (docs/architecture/deploy.md)
    preconditions:
      - sh: command -v fly
        msg: 'flyctl is missing. Enter the dev shell first: direnv allow, or nix develop.'
      - sh: fly auth whoami > /dev/null 2>&1
        msg: 'Not signed in to Fly. Run: fly auth login'
    cmds:
      - fly deploy --remote-only --build-arg BUILD_COMMIT=$(git rev-parse HEAD)

  deploy:secrets:
    desc: Render .env.prod.tpl from the overview-prod Bitwarden project straight into fly secrets, touching no file
    preconditions:
      - sh: command -v fly
        msg: 'flyctl is missing. Enter the dev shell first: direnv allow, or nix develop.'
      - sh: test -n "${BWS_ACCESS_TOKEN:-}"
        msg: 'No Bitwarden access token in the environment. Store one with: task secrets:login'
    cmds:
      - BWS_PROJECT={{.PROD_PROJECT}} scripts/secrets.sh fly-import

  deploy:image:
    desc: Build the production image locally with Docker, as CI does, without deploying it
    preconditions:
      - sh: command -v docker
        msg: 'Docker is missing.'
    cmds:
      - docker build --build-arg BUILD_COMMIT=$(git rev-parse HEAD) --tag overview:local .

  deploy:status:
    desc: The app's machines and the last release
    cmds:
      - fly status

  deploy:logs:
    desc: 'Follow the running app''s log (e.g. task deploy:logs)'
    cmds:
      - fly logs

  deploy:extension:
    desc: Build the extension and zip it into apps/extension/release, twice: one for the Web Store, one keyed to load unpacked
    dir: apps/extension
    preconditions:
      - sh: command -v zip && command -v unzip
        msg: 'zip or unzip is missing. Enter the dev shell first: direnv allow, or nix develop.'
    cmds:
      - npm run zip

  deploy:extension:id:
    desc: Print the extension's origin for CORS_ALLOWED_ORIGINS, derived from the store's key in its manifest
    cmds:
      - node scripts/extensionId.mjs
